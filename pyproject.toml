[project]
name = "hexlet-code"
version = "0.1.0"
description = "A URL shortener service (CRUD API + redirect) built with FastAPI, SQLModel and PostgreSQL"
readme = "README.md"
authors = [
    { name = "Mihail Pirko", email = "mihailpirko@example.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
