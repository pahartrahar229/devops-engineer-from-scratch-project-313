[project]
name = "devops-engineer-from-scratch-project-313"
version = "0.1.0"
description = "A minimal Flask web application with a /ping endpoint"
readme = "README.md"
authors = [
    { name = "Mihail Pirko", email = "pirkomihail85@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.16.3",
]
[tool.pytest.ini_options]
pythonpath = ["."]